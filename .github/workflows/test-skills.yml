name: Test Skills

on:
  push:
    paths:
      - 'plugins/**'
      - 'rules/**'
      - 'assets/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - '.github/workflows/test-skills.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - 'rules/**'
      - 'assets/**'
      - '.claude-plugin/**'
      - '.cursor-plugin/**'
      - '.agents/**'
      - 'scripts/*.py'
      - 'scripts/*.sh'
      - '.github/workflows/test-skills.yml'

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Also runnable locally: python3 scripts/validate-plugins.py
      - name: Validate manifests and skill frontmatter
        run: python3 scripts/validate-plugins.py

      # Fixtures for the agents/openai.yaml checks, including malformed and
      # incomplete metadata that must not pass.
      - name: Test the validator
        run: python3 scripts/test-validate-plugins.py

  lint-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate shell scripts syntax
        run: |
          shopt -s globstar nullglob
          for script in plugins/**/templates/*.sh; do
            echo "Checking syntax: $script"
            bash -n "$script"
          done

      - name: Lint with shellcheck
        # Pinned: @master is a mutable branch, so an upstream push would
        # change what runs in CI without a commit here. SHA is master as of
        # 2024-06-20, the revision this repo has been running.
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: './plugins'
          severity: warning

      - name: Lint repo scripts with shellcheck
        # Pinned: @master is a mutable branch, so an upstream push would
        # change what runs in CI without a commit here. SHA is master as of
        # 2024-06-20, the revision this repo has been running.
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca
        with:
          scandir: './scripts'
          severity: warning
